services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentscreen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentscreen}
      POSTGRES_USER: ${POSTGRES_USER:-talentscreen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talentscreen}
    ports:
      - "5434:5432"
    volumes:
      - talentscreen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentscreen} -d ${POSTGRES_DB:-talentscreen}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talentscreen_postgres_data:
